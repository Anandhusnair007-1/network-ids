name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check --line-length 120 --select F,E,W --ignore E501 src api dashboard tests
      - name: Compile
        run: python -m compileall -q src api dashboard
      - name: Tests (model-dependent tests skip without trained artifacts)
        run: python -m pytest tests -q
      - name: Security scan (medium+ severity fails the build)
        run: bandit -q -r src api dashboard -ll
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt
        continue-on-error: true
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t network-ids:ci .
